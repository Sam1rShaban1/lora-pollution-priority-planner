# Template: copy this file and change `place` to run the pipeline anywhere.
# With no AQ/weather data, the priority RANKING is still valid (baseline-invariant).
place: "Skopje, North Macedonia"    # any OSM-geocodable place
utm_crs: "EPSG:32634"               # metric CRS covering the place (UTM zone)
candidates_csv: null                # null -> auto-generate candidates
n_candidates: 100
aq_csv: null                        # optional: aqicn.org daily export
weather_csv: null                   # optional: meteostat hourly export
pm_baseline: 25.0                   # fallback baseline (ug/m3)
rssi_bias_db: 0.0                   # apply your field calibration here
k_gateways: 5
