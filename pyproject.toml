[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aqlora"
version = "1.2.0"
description = "Pollution-priority-aware LoRaWAN gateway placement from open data"
license = {text = "MIT"}
authors = [{name = "Samir Shabani"}, {name = "Mennan Selimi"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "geopandas>=0.14",
  "shapely>=2.0", "osmnx>=1.9", "requests", "Pillow", "pymoo>=0.6,<0.7",
  "xgboost>=2.0", "scikit-learn>=1.3", "pyyaml", "matplotlib",
  "rasterio>=1.3", "pyproj>=3.5", "contextily>=1.5",
]

[project.optional-dependencies]
notebooks = ["nbclient>=0.10", "nbformat>=5.9", "jupyter>=1.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
